/* =========================================================
   TEMPERAMENT
========================================================= */

function getTemperament(thermal, moisture){

  if(thermal >= 12 && moisture >= 12)
    return "دموی";

  if(thermal >= 12 && moisture <= -12)
    return "صفراوی";

  if(thermal <= -12 && moisture >= 12)
    return "بلغمی";

  if(thermal <= -12 && moisture <= -12)
    return "سوداوی";

  if(thermal >= 12)
    return "گرم";

  if(thermal <= -12)
    return "سرد";

  if(moisture >= 12)
    return "تر";

  if(moisture <= -12)
    return "خشک";

  return "متعادل / ترکیبی";
}


function temperamentClass(temp){

  if(temp.includes("دموی"))
    return "temperament-damavi";

  if(temp.includes("صفراوی"))
    return "temperament-safrav";

  if(temp.includes("بلغمی"))
    return "temperament-balghami";

  if(temp.includes("سوداوی"))
    return "temperament-sodavi";

  return "temperament-neutral";
}

    "صفراوی":
      "الگوی غالب گرم و خشک است. شاخص‌های گرمی و خشکی در پاسخ‌های ثبت‌شده برجستگی بیشتری داشته‌اند.",

    "سوداوی":

/* =========================================================
   DOMINANT HUMOR
========================================================= */

function dominantName(key){

  const names = {
    damavi:"دموی",
    safrav:"صفراوی",
    balghami:"بلغمی",
    sodavi:"سوداوی",
    ترکیبی:"ترکیبی"
  };

  return names[key] || "نامشخص";
}


/* =========================================================
   CALCULATE
========================================================= */

function calculate(){

  try{

    let thermal = 0;
    let moisture = 0;

    const unanswered = [];

    /* -----------------------------------------
       بررسی و محاسبه 20 سؤال
    ----------------------------------------- */

    qs.forEach((q,index)=>{

      const selected = document.querySelector(
        `input[name="q${index}"]:checked`
      );

      if(!selected){

        unanswered.push(index + 1);
        return;
      }

      const value = Number(selected.value);

      if(
        Number.isNaN(value) ||
        !q.thermal[value] === undefined
      ){
        throw new Error(
          `خطا در پاسخ سؤال شماره ${index + 1}`
        );
      }

      thermal += Number(q.thermal[value] || 0) * q.weight;
      moisture += Number(q.moisture[value] || 0) * q.weight;

    });


    /* -----------------------------------------
       جلوگیری از محاسبه ناقص
    ----------------------------------------- */

    if(unanswered.length > 0){

      alert(
        "لطفاً به همه ۲۰ سؤال پاسخ دهید.\n\n" +
        "سؤال‌های بدون پاسخ:\n" +
        unanswered.join("، ")
      );

      const firstQuestion =
        document.getElementById(
          `questionBox${unanswered[0] - 1}`
        );

      if(firstQuestion){

        firstQuestion.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });

      }

      return;
    }


    /* -----------------------------------------
       مزاج
    ----------------------------------------- */

    const temp =
      getTemperament(thermal,moisture);


    /* -----------------------------------------
       وضوح
    ----------------------------------------- */

    let clarity = "متوسط";

    if(
      Math.abs(thermal) >= 24 &&
      Math.abs(moisture) >= 24
    ){

      clarity = "بسیار واضح";

    }
    else if(
      Math.abs(thermal) >= 18 &&
      Math.abs(moisture) >= 18
    ){

      clarity = "واضح";

    }


    /* -----------------------------------------
       اخلاط
    ----------------------------------------- */

    const humorScores = {

      damavi:
        document.querySelectorAll(
          'input[name="damavi"]:checked'
        ).length,

      safrav:
        document.querySelectorAll(
          'input[name="safrav"]:checked'
        ).length,

      balghami:
        document.querySelectorAll(
          'input[name="balghami"]:checked'
        ).length,

      sodavi:
        document.querySelectorAll(
          'input[name="sodavi"]:checked'
        ).length

    };


    const sortedHumors =
      Object.entries(humorScores)
        .sort((a,b)=>b[1]-a[1]);


    let dominant =
      sortedHumors[0][0];


    if(
      sortedHumors[0][1] ===
      sortedHumors[1][1]
    ){

      dominant = "ترکیبی";

    }


    /* -----------------------------------------
       درصد مزاج‌ها
    ----------------------------------------- */

    const warm =
      Math.max(0,thermal);

    const cold =
      Math.max(0,-thermal);

    const wet =
      Math.max(0,moisture);

    const dry =
      Math.max(0,-moisture);


    const raw = {

      damavi: warm + wet,

      safrav: warm + dry,

      balghami: cold + wet,

      sodavi: cold + dry

    };


    const total =
      Object.values(raw)
        .reduce(
          (sum,value)=>sum + value,
          0
        );


    let percentages;


    if(total === 0){

      percentages = {
        damavi:25,
        safrav:25,
        balghami:25,
        sodavi:25
      };

    }
    else{

      percentages = {

        damavi:
          raw.damavi / total * 100,

        safrav:
          raw.safrav / total * 100,

        balghami:
          raw.balghami / total * 100,

        sodavi:
          raw.sodavi / total * 100

      };

    }


    /* -----------------------------------------
       اطلاعات مراجعه کننده
    ----------------------------------------- */

    const getValue = id =>
      document.getElementById(id)?.value?.trim() || "—";


    const name =
      getValue("name");

    const caseNo =
      getValue("caseNo");

    const age =
      getValue("age");

    const sex =
      document.getElementById("sex")?.value || "—";

    const phone =
      getValue("phone");

    const date =
      document.getElementById("date")?.value || "—";

    const note =
      getValue("initialNote") === "—"
        ? "یادداشت خاصی ثبت نشده است."
        : getValue("initialNote");


    /* -----------------------------------------
       پر کردن گزارش
    ----------------------------------------- */

    document.getElementById("rName").textContent =
      name;

    document.getElementById("rCaseNo").textContent =
      caseNo;

    document.getElementById("rAge").textContent =
      age;

    document.getElementById("rSex").textContent =
      sex;

    document.getElementById("rPhone").textContent =
      phone;

    document.getElementById("rDate").textContent =
      formatDate(date);

    document.getElementById("reportInitialNote").textContent =
      note;


    /* -----------------------------------------
       نتیجه اصلی
    ----------------------------------------- */

    const hero =
      document.getElementById("resultHero");


    hero.className =
      "result-hero " +
      temperamentClass(temp);


    document.getElementById("resultTitle").textContent =
      temp;


    document.getElementById("resultSubtitle").textContent =
      "الگوی غالب اخلاطی: " +
      dominantName(dominant) +
      " | وضوح نتیجه: " +
      clarity;


    /* -----------------------------------------
       محور حرارتی
    ----------------------------------------- */

    let thermalText = "متعادل (0)";

    if(thermal > 0){

      thermalText =
        `گرم (${thermal})`;

    }
    else if(thermal < 0){

      thermalText =
        `سرد (${Math.abs(thermal)})`;

    }


    document.getElementById("thermalResult").textContent =
      thermalText;


    /* -----------------------------------------
       محور رطوبتی
    ----------------------------------------- */

    let moistureText = "متعادل (0)";

    if(moisture > 0){

      moistureText =
        `تر (${moisture})`;

    }
    else if(moisture < 0){

      moistureText =
        `خشک (${Math.abs(moisture)})`;

    }


    document.getElementById("moistureResult").textContent =
      moistureText;


    document.getElementById("clarityResult").textContent =
      clarity;


    document.getElementById("temperamentDescription").textContent =
      temperamentDescription(temp);


    /* -----------------------------------------
       نتایج اخلاط
    ----------------------------------------- */

    updateHumorResult(
      "damavi",
      humorScores.damavi
    );

    updateHumorResult(
      "safrav",
      humorScores.safrav
    );

    updateHumorResult(
      "balghami",
      humorScores.balghami
    );

    updateHumorResult(
      "sodavi",
      humorScores.sodavi
    );


    /* -----------------------------------------
       نمودار
    ----------------------------------------- */

    setChart(
      "Damavi",
      percentages.damavi
    );

    setChart(
      "Safrav",
      percentages.safrav
    );

    setChart(
      "Balgham",
      percentages.balghami
    );

    setChart(
      "Soda",
      percentages.sodavi
    );


    /* -----------------------------------------
       نمایش گزارش
    ----------------------------------------- */

    const report =
      document.getElementById("report");


    report.style.display =
      "block";


    setTimeout(()=>{

      report.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    },100);

  }
  catch(error){

    console.error(
      "CALCULATION ERROR:",
      error
    );

    alert(
      "در محاسبه ارزیابی خطایی رخ داده است.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   CHART
========================================================= */

function setChart(name,value){

  const rounded =
    Math.round(value * 10) / 10;


  const bar =
    document.getElementById(
      "chart" + name
    );


  const valueEl =
    document.getElementById(
      "chart" + name + "Value"
    );


  if(!bar || !valueEl){

    console.error(
      "Chart element not found:",
      name
    );

    return;
  }


  bar.dataset.height =
    rounded;


  bar.style.height =
    "0%";


  valueEl.textContent =
    rounded + "%";


  requestAnimationFrame(()=>{

    setTimeout(()=>{

      bar.style.height =
        rounded + "%";

    },50);

  });

}


/* =========================================================
   HUMOR RESULT
========================================================= */

function updateHumorResult(key,score){

  const scoreElement =
    document.getElementById(
      key + "Score"
    );


  const progressElement =
    document.getElementById(
      key + "Progress"
    );


  if(!scoreElement || !progressElement){

    console.error(
      "Humor result element not found:",
      key
    );

    return;
  }


  const percentage =
    Math.round(
      (score / 6) * 100
    );


  scoreElement.textContent =
    `${score}/6`;


  progressElement.style.width =
    percentage + "%";

}


/* =========================================================
   DATE
========================================================= */

function formatDate(date){

  if(!date)
    return "—";


  const parts =
    date.split("-");


  if(parts.length !== 3)
    return date;


  return `${parts[2]}/${parts[1]}/${parts[0]}`;

}


/* =========================================================
   SAVE CASE
========================================================= */

function saveCase(){

  try{

    const cases =
      JSON.parse(
        localStorage.getItem(
          "hakimCases"
        ) || "[]"
      );


    const record = {

      id:Date.now(),

      name:
        document.getElementById("name").value.trim(),

      caseNo:
        document.getElementById("caseNo").value.trim(),

      age:
        document.getElementById("age").value.trim(),

      sex:
        document.getElementById("sex").value,

      phone:
        document.getElementById("phone").value.trim(),

      date:
        document.getElementById("date").value,

      note:
        document.getElementById("initialNote").value.trim(),

      savedAt:
        new Date().toISOString()

    };


    cases.unshift(record);


    if(cases.length > 100){
      cases.length = 100;
    }


    localStorage.setItem(
      "hakimCases",
      JSON.stringify(cases)
    );


    renderCases();


    alert(
      "پرونده با موفقیت ذخیره شد."
    );

  }
  catch(error){

    console.error(error);

    alert(
      "ذخیره پرونده انجام نشد."
    );

  }

}

  try{

    cases =
      JSON.parse(
        localStorage.getItem(
          "hakimCases"
        ) || "[]"
      );

  }
  catch(error){

    cases = [];

  }


  if(!cases.length){

    list.innerHTML =
      `<div style="color:#777;font-size:13px;">
        هنوز پرونده‌ای ذخیره نشده است.
      </div>`;

    return;
  }


  list.innerHTML =
    cases.map(item=>`

      <div class="case-item">

        <div class="case-info">

          <strong>
            ${escapeHtml(
              item.name || "بدون نام"
            )}
          </strong>

          <br>

          پرونده:
          ${escapeHtml(
            item.caseNo || "—"
          )}

          |

          سن:
          ${escapeHtml(
            item.age || "—"
          )}

          |

          تاریخ:
          ${formatDate(item.date)}

        </div>

        <div class="case-actions">

          <button
            class="btn btn-light"
            onclick="loadCase(${item.id})"
          >
            مشاهده
          </button>

          <button
            class="btn btn-danger"
            onclick="delCase(${item.id})"
          >
            حذف
          </button>

        </div>

      </div>

    `).join("");

}


/* =========================================================
   LOAD CASE
========================================================= */

function loadCase(id){

  const cases =
    JSON.parse(
      localStorage.getItem(
        "hakimCases"
      ) || "[]"
    );


  const item =
    cases.find(
      x => x.id === id
    );


  if(!item)
    return;


  document.getElementById("name").value =
    item.name || "";

  document.getElementById("caseNo").value =
    item.caseNo || "";

  document.getElementById("age").value =
    item.age || "";

  document.getElementById("sex").value =
    item.sex || "";

  document.getElementById("phone").value =
    item.phone || "";

  document.getElementById("date").value =
    item.date || "";

  document.getElementById("initialNote").value =
    item.note || "";


  /*
     توجه:
     در ساختار فعلی پرونده‌ها پاسخ 20 سؤال
     ذخیره نمی‌شود؛ بنابراین بعد از بارگذاری
     پرونده نمی‌توان محاسبه قبلی را بازسازی کرد.
  */

  alert(
    "اطلاعات مراجعه‌کننده بارگذاری شد.\n" +
    "برای محاسبه، پاسخ سؤال‌ها را نیز وارد کنید."
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   DELETE CASE
========================================================= */

function delCase(id){

  if(
    !confirm(
      "آیا از حذف این پرونده مطمئن هستید؟"
    )
  ){
    return;
  }


  let cases =
    JSON.parse(
      localStorage.getItem(
        "hakimCases"
      ) || "[]"
    );


  cases =
    cases.filter(
      x => x.id !== id
    );


  localStorage.setItem(
    "hakimCases",
    JSON.stringify(cases)
  );


  renderCases();

}


/* =========================================================
   RESET
========================================================= */

function resetForm(){

  if(
    !confirm(
      "اطلاعات فرم پاک شود و ارزیابی جدید آغاز شود؟"
    )
  ){
    return;
  }


  [
    "name",
    "caseNo",
    "age",
    "phone",
    "initialNote"
  ].forEach(id=>{

    const element =
      document.getElementById(id);

    if(element)
      element.value = "";

  });


  document.getElementById("sex").value =
    "";


  document.querySelectorAll(
    'input[type="radio"], input[type="checkbox"]'
  ).forEach(input=>{

    input.checked = false;

  });


  document.getElementById("report").style.display =
    "none";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   PRINT
========================================================= */

function printReport(){

  const report =
    document.getElementById(
      "report"
    );


  if(
    !report ||
    report.style.display === "none"
  ){

    alert(
      "ابتدا نتیجه ارزیابی را محاسبه کنید."
    );

    return;
  }


  window.print();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   INITIALIZE
========================================================= */

renderQuestions();

renderHumors();

renderCases();


/* تاریخ امروز */

(function(){

  const date =
    document.getElementById(
      "date"
    );


  if(
    date &&
    !date.value
  ){

    const now =
      new Date();


    const year =
      now.getFullYear();


    const month =
      String(
        now.getMonth() + 1
      ).padStart(2,"0");


    const day =
      String(
        now.getDate()
      ).padStart(2,"0");


    date.value =
      `${year}-${month}-${day}`;

  }

})();

   PWA

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    ()=>{
      navigator.serviceWorker
        .register("sw.js")
        .catch(error=>{
          console.log(
            "Service Worker Error:",
            error
          );
        });
    }
  );

}
